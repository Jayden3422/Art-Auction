name: SEO Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VUE_APP_APP_PORT: 3000
          ENABLE_PRERENDER: 0
        run: npm run build

      - name: Start backend server
        working-directory: backend
        env:
          NODE_ENV: production
          APP_PORT: 3000
          WS_PORT: 3001
          SITE_URL: http://127.0.0.1:3000
          TRUST_PROXY: loopback
        run: |
          nohup npm run start > ../tmp-backend.log 2>&1 &
          echo $! > ../tmp-backend.pid

      - name: Wait for backend
        run: npx wait-on@7.2.0 http://127.0.0.1:3000/robots.txt

      - name: Run SEO structural gate
        working-directory: backend
        env:
          SEO_CHECK_BASE_URL: http://127.0.0.1:3000
        run: npm run seo:ci

      - name: Run Lighthouse CI gate
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: npx @lhci/cli@0.15.1 autorun --config=.lighthouserc.json

      - name: Stop backend and print logs
        if: always()
        run: |
          if [ -f tmp-backend.pid ]; then
            kill "$(cat tmp-backend.pid)" || true
          fi
          if [ -f tmp-backend.log ]; then
            echo "==== backend log ===="
            cat tmp-backend.log
          fi
